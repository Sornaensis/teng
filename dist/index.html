<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#18232b" />
    <meta
      name="description"
      content="TENG Conlang Creator. A browser-local workspace for phonology, orthography, morphology, grammar, and lexicon construction."
    />
    <title>TENG Conlang Creator</title>
    <link rel="icon" type="image/svg+xml" href="./assets/teng.svg" />
    <link rel="stylesheet" href="./styles.css" />
    <script type="module" src="./app.js"></script>
  </head>
  <body>
    <div id="app">
      <div class="loading">
        <img class="brand-mark" src="./assets/teng.svg" alt="TENG" />
        <p>Opening TENG…</p>
      </div>
    </div>
    <dialog id="modal" aria-labelledby="dialog-title"></dialog>
    <div id="toasts" role="status" aria-live="polite"></div>
    <input
      id="import-json"
      type="file"
      accept=".json,application/json"
      hidden
    />
    <input id="import-csv" type="file" accept=".csv,text/csv" hidden />
  </body>
</html>
